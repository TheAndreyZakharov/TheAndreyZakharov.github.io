    <link rel="apple-touch-icon" sizes="512x512" href="/favicon-light.png" />

    <meta name="description" content="Personal website of Andrey Zakharov with professional information, contact details, social profiles, and CVs." />

    <meta name="application-name" content="Andrey Zakharov" />

    <meta property="og:url" content="https://theandreyzakharov.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Andrey Zakharov" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:title" content="Andrey Zakharov — Personal Website" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Andrey Zakharov",
        "alternateName": ["Андрей Захаров", "theandreyzakharov.com"],
        "url": "https://theandreyzakharov.com/"
      }
    </script>

    <script>
      (() => {
        let savedTheme = null;
        try { savedTheme = window.localStorage.getItem("theme-mode"); } catch {}
        const isDark = savedTheme === "dark" || (savedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.initialTheme = isDark ? "dark" : "light";
        document.documentElement.style.backgroundColor = isDark ? "#161716" : "#ecece9";
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
