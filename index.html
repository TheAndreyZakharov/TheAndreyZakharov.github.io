<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Andrey Zakharov</title>

    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=3" />

    <script>
      (() => {
        let savedTheme = null;
        try { savedTheme = window.localStorage.getItem("theme-mode"); } catch {}
        const isDark = savedTheme === "dark" || (savedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.initialTheme = isDark ? "dark" : "light";
        document.documentElement.style.backgroundColor = isDark ? "#161716" : "#ecece9";
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
